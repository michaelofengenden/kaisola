name: native-visual

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-visual.yml'
      - 'native/KaisolaMac/**'

permissions:
  contents: read

concurrency:
  group: native-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve native app version
        run: >-
          node -e
          "require('fs').appendFileSync(process.env.GITHUB_ENV,
          'KAISOLA_VISUAL_VERSION=' + require('./package.json').version + '\\n')"

      - name: Build native visual fixture
        run: >-
          xcodebuild
          -project native/KaisolaMac/KaisolaMac.xcodeproj
          -scheme Kaisola
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/kaisola-native-visual"
          MARKETING_VERSION="$KAISOLA_VISUAL_VERSION"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Capture workspace, document, Mesh, Settings, and Usage states
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/kaisola-native-visual/Build/Products/Debug/Kaisola.app"
          binary="$app/Contents/MacOS/Kaisola"
          output="$RUNNER_TEMP/kaisola-native-screenshots"
          mkdir -p "$output"

          verify_capture() {
            local capture="$1"
            local surface="$2"
            test -s "$capture"
            local bytes width height minimum_bytes
            bytes="$(stat -f%z "$capture")"
            minimum_bytes=20000
            if [[ "$surface" == workspace-rename || "$surface" == workspace-new-file || "$surface" == workspace-move ]]; then
              # These compact AppKit sheets are mostly flat material and text,
              # so a valid crop can compress below the workspace-wide floor.
              minimum_bytes=10000
            fi
            test "$bytes" -gt "$minimum_bytes"
            width="$(sips -g pixelWidth "$capture" | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$capture" | awk '/pixelHeight/ {print $2}')"
            echo "KAISOLA_NATIVE_VISUAL_GEOMETRY=$surface ${width}x${height} bytes=$bytes"
            # Settings fixtures are intentionally compact. Every other surface
            # must keep the large workspace footprint. GitHub's headless
            # WindowServer scales the declared 1360x860 and 810x540 content
            # frames to about 1024x681 and 810x568 captured pixels respectively.
            # These bounds still catch AppKit frame-autosave leakage without
            # rejecting that stable runner scaling.
            if [[ "$surface" == workspace-rename || "$surface" == workspace-new-file ]]; then
              # NSAlert sheet crops are 260x241 on the headless runner and
              # 520x324 on a local Retina display.
              test "$width" -ge 250
              test "$height" -ge 230
            elif [[ "$surface" == workspace-move ]]; then
              # The declared 460x440 SwiftUI move sheet may be captured at
              # either point or Retina pixel dimensions.
              test "$width" -ge 450
              test "$height" -ge 400
            elif [[ "$surface" == account-picker ]]; then
              # NSAlert sizes to its informative text and host display scale.
              # ScreenCaptureKit may return either the compact 372x274 sheet
              # crop or a padded 640x460 host capture; both still contain the
              # fixed-width 340-point account picker, message, and actions.
              test "$width" -ge 360
              test "$height" -ge 260
            elif [[ "$surface" == terminal-transcript ]]; then
              # The transcript is an attached sheet with a declared 620-point
              # minimum width, not a settings window. Its hosted capture is an
              # unscaled sheet crop (currently 620x644).
              test "$width" -ge 600
              test "$height" -ge 600
            elif [[ "$surface" == onboarding ]]; then
              test "$width" -ge 700
              test "$height" -ge 500
            elif [[ "$surface" == settings || "$surface" == settings-terminal || "$surface" == settings-terminal-history || "$surface" == settings-terminal-interaction || "$surface" == settings-companion || "$surface" == settings-mcp || "$surface" == settings-models || "$surface" == settings-shortcuts || "$surface" == settings-account-recovery || "$surface" == usage ]]; then
              test "$width" -ge 800
              test "$height" -ge 540
            else
              test "$width" -ge 1000
              test "$height" -ge 660
            fi
          }

          run_fixture() {
            local surface="$1"
            local capture="$2"
            local log="$output/$surface.log"
            shift 2
            echo "KAISOLA_NATIVE_VISUAL_SURFACE_BEGIN=$surface"
            # Each fixture normally captures and exits in under eight seconds.
            # Keep a broken AppKit sheet or framework callback from hiding the
            # responsible surface until the job-wide 25-minute timeout. POSIX
            # preserves alarm(2) across exec, including env -> Kaisola.
            if /usr/bin/perl -e '
              $seconds = shift @ARGV;
              alarm $seconds;
              exec @ARGV or die "exec failed: $!\n";
            ' 20 /usr/bin/env \
              KAISOLA_NATIVE_VISUAL_FIXTURE=1 \
              KAISOLA_NATIVE_VISUAL_SURFACE="$surface" \
              KAISOLA_NATIVE_VISUAL_WORKSPACE="$GITHUB_WORKSPACE" \
              KAISOLA_NATIVE_VISUAL_CAPTURE_PATH="$capture" \
              "$@" 2>&1 | tee "$log"; then
              if [[ "$surface" == terminal-ownership-flap ]]; then
                node - "$log" <<'NODE'
          const fs = require('node:fs')
          const prefix = 'KAISOLA_NATIVE_VISUAL_OWNERSHIP_FLAP='
          const line = fs.readFileSync(process.argv[2], 'utf8')
            .split(/\r?\n/u)
            .find((entry) => entry.startsWith(prefix))
          if (!line) throw new Error('missing terminal ownership-flap receipt')
          const receipt = JSON.parse(line.slice(prefix.length))
          if (receipt.ok !== true
              || receipt.bytes !== 5 * 1024 * 1024
              || receipt.sameView !== true
              || receipt.sameCoordinator !== true
              || receipt.sameTerminal !== true
              || receipt.mountedView !== true
              || receipt.selectionStable !== true
              || receipt.scrollStable !== true
              || receipt.cursorStable !== true
              || receipt.linkStable !== true
              || receipt.liveFollowStable !== true
              || receipt.revokedPresentationObserved !== true
              || receipt.additionalReplayStarts !== 0) {
            throw new Error(`invalid terminal ownership-flap receipt: ${JSON.stringify(receipt)}`)
          }
          NODE
              fi
              echo "KAISOLA_NATIVE_VISUAL_SURFACE_END=$surface"
            else
              local status="$?"
              echo "KAISOLA_NATIVE_VISUAL_SURFACE_FAIL=$surface status=$status" >&2
              return "$status"
            fi
          }

          for surface in terminal terminal-solo terminal-semantic terminal-scroll-output terminal-ownership-flap terminal-transcript account-picker attention-completed companion-control mixed permission palette preview preview-narrow preview-code-editor preview-dirty-tab preview-tab-overflow preview-table-edit preview-html preview-docx preview-pdf workspace-rename workspace-new-file workspace-move topbar topbar-attention mesh onboarding settings settings-terminal settings-terminal-history settings-terminal-interaction settings-companion settings-mcp settings-models settings-shortcuts settings-account-recovery usage; do
            capture="$output/$surface.png"
            run_fixture "$surface" "$capture" \
              "$binary" -ApplePersistenceIgnoreState YES
            verify_capture "$capture" "$surface"
          done

          for surface in terminal terminal-semantic mixed permission palette preview-code-editor workspace-move topbar-attention mesh onboarding settings-terminal settings-shortcuts; do
            capture="$output/dark-$surface.png"
            run_fixture "$surface" "$capture" \
              /usr/bin/env KAISOLA_NATIVE_VISUAL_APPEARANCE=dark "$binary"
            verify_capture "$capture" "$surface"
          done

          # Dimension and file-size checks cannot distinguish a real capture
          # from an all-transparent material-backed sheet. Sample visible
          # alpha and luminance once across the complete inspection set.
          xcrun swift scripts/native-visual-image-gate.swift "$output"/*.png

      - name: Upload native visual inspection set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-visual-${{ github.sha }}
          path: ${{ runner.temp }}/kaisola-native-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
