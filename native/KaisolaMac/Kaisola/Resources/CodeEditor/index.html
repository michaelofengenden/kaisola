<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaisola Source Editor</title>
  <style>
    :root { color-scheme: light dark; }
    html, body, #editor { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: transparent; }
    .cm-editor { width: 100%; height: 100%; }
    .cm-editor.cm-focused { outline: none; }
  </style>
</head>
<body>
  <main id="editor" aria-label="Source editor"></main>
  <script src="editor.bundle.js"></script>
</body>
</html>
