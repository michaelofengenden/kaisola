name: KaisolaCompanion

options:
  bundleIdPrefix: com.kaisola
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.0.0
    # Michael's Apple Developer team — matches the registered App ID prefix.
    DEVELOPMENT_TEAM: KBD9RS8425

packages:
  KaisolaCore:
    path: ../../native/KaisolaCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0

targets:
  KaisolaCompanion:
    type: application
    platform: iOS
    info:
      path: KaisolaCompanion/Account/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.kaisola.companion.auth
            CFBundleURLSchemes:
              - kaisola
    sources:
      - path: KaisolaCompanion
      - path: ../../tests/fixtures/companion
        buildPhase: resources
    dependencies:
      - package: KaisolaCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaisola.companion
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1"
        # Declared, because deriving it from SDKROOT gives device only.
        #
        # Without this the scheme reported *zero* eligible destinations — the
        # Simulator was not among them — so the Companion could only ever be
        # built onto physical hardware. That is why PR 5's whole matrix read as
        # blocked on a phone: pairing, resume, revoke, account isolation and
        # capability grants are all reachable in the Simulator, which shares the
        # Mac's network stack and therefore sees the Mac's `_kaisola._tcp`
        # advertisement.
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kaisola
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Kaisola discovers and securely connects to your paired Mac on the local network.
        INFOPLIST_KEY_NSCameraUsageDescription: Kaisola uses the camera to scan the pairing code shown on your Mac.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Kaisola uses Face ID to unlock agent and terminal control on your paired Mac.
        INFOPLIST_KEY_NSBonjourServices:
          - _kaisola._tcp
        # Standard-algorithm end-to-end encryption qualifies for the mass-market
        # exemption; declaring it here skips the per-build compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

  KaisolaCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KaisolaCompanionTests
      - path: ../../tests/fixtures/companion
        buildPhase: resources
    dependencies:
      - target: KaisolaCompanion
      - package: KaisolaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaisola.companion.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  KaisolaCompanion:
    build:
      targets:
        KaisolaCompanion: all
        KaisolaCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: KaisolaCompanionTests
