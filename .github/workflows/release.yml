# Promote an already signed, notarized, stapled candidate for this exact commit.
# The expensive candidate is produced by release-candidate.yml on protected
# main. This tag lane performs no build, signing, or notarization work.
name: release

on:
  push:
    tags: ['v*']

concurrency:
  # Asset publication and the permanent Sparkle feed are serialized together.
  group: kaisola-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Resolve the immutable candidate for this tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "PROMOTION_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be vx.y.z; found $GITHUB_REF_NAME" >&2
            exit 1
          }
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          }

          # A rerun must remain bound to the candidate receipt already on the
          # release. It may never silently select newer bytes for the same tag.
          prior_directory="$RUNNER_TEMP/prior-release"
          run_id=''
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p "$prior_directory"
            if gh release download "$GITHUB_REF_NAME" \
              --pattern release-candidate.json \
              --dir "$prior_directory"; then
              run_id="$(node -e '
                const fs = require("fs")
                const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
                const id = String(receipt.workflow?.runID || "")
                if (!/^[1-9]\d*$/.test(id)) process.exit(2)
                process.stdout.write(id)
              ' "$prior_directory/release-candidate.json")"
            else
              # A just-created but still-empty release is safely recoverable.
              # Any unreceipted asset is ambiguous and therefore fails closed.
              asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets | length')"
              test "$asset_count" = 0 || {
                echo 'existing release has assets but no immutable candidate receipt' >&2
                exit 1
              }
            fi
          fi
          if [[ -z "$run_id" ]]; then
            runs="$RUNNER_TEMP/candidate-runs.json"
            gh api -X GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-candidate.yml/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f status=success \
              -f per_page=100 > "$runs"
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.head_branch == "main")
                | select(.conclusion == "success")
                | select(.event == "push" or .event == "workflow_dispatch")]
              | sort_by(.run_number, .run_attempt)
              | last
              | .id // empty
            ' "$runs")"
            test -n "$run_id" || {
              echo "no successful native release candidate exists for $GITHUB_SHA" >&2
              exit 1
            }
          fi

          run="$RUNNER_TEMP/candidate-run.json"
          artifacts="$RUNNER_TEMP/candidate-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run"
          jq -e --arg sha "$GITHUB_SHA" '
            .head_sha == $sha and .head_branch == "main" and .conclusion == "success"
          ' "$run" >/dev/null || {
            echo 'selected candidate run is not a successful exact-commit main run' >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" > "$artifacts"
          artifact_digest="$(jq -r '
            [.artifacts[] | select(.name == "kaisola-native-candidate" and (.expired | not))]
            | if length == 1 then .[0].digest // empty else empty end
          ' "$artifacts")"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'candidate run must have exactly one unexpired SHA-256-addressed artifact' >&2
            exit 1
          }
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact-digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download exact candidate artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kaisola-native-candidate
          path: release/native
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}
      - name: Verify provenance, checksums, and Sparkle signature before unpacking
        run: |
          set -euo pipefail
          node scripts/native-release-candidate.cjs verify \
            --directory "$GITHUB_WORKSPACE/release/native" \
            --receipt "$GITHUB_WORKSPACE/release/native/release-candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "${{ steps.candidate.outputs.run-id }}" \
            --version "${{ steps.candidate.outputs.version }}" \
            --tag "$GITHUB_REF_NAME"
      - name: Verify the notarized app and sealed BrokerHelper identity
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/release/native/release-candidate.json"
          build="$(node -e '
            const receipt = require(process.argv[1])
            const build = String(receipt.application?.build || "")
            if (!/^[1-9]\d*$/.test(build)) process.exit(2)
            process.stdout.write(build)
          ' "$receipt")"
          archive="$GITHUB_WORKSPACE/release/native/Kaisola-${{ steps.candidate.outputs.version }}-b${build}.zip"
          unpack_directory="$RUNNER_TEMP/kaisola-promoted-app"
          preflight="$RUNNER_TEMP/promotion-preflight.json"
          mkdir -p "$unpack_directory"
          ditto -x -k "$archive" "$unpack_directory"
          node scripts/native-release-preflight.cjs \
            --app "$unpack_directory/Kaisola.app" \
            --require-updates --require-notarized \
            --source-commit "$GITHUB_SHA" \
            --json-output "$preflight"
          node scripts/native-release-candidate.cjs verify \
            --directory "$GITHUB_WORKSPACE/release/native" \
            --receipt "$receipt" \
            --preflight "$preflight" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "${{ steps.candidate.outputs.run-id }}" \
            --version "${{ steps.candidate.outputs.version }}" \
            --tag "$GITHUB_REF_NAME"
          echo "NATIVE_BUILD_VERSION=$build" >> "$GITHUB_ENV"
      - name: Generate appcast from the candidate's prepared signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/release/native/release-candidate.json"
          appcast_directory="$RUNNER_TEMP/kaisola-appcast"
          existing_appcast="$appcast_directory/existing.xml"
          generated_appcast="$appcast_directory/appcast.xml"
          archive_name="Kaisola-${{ steps.candidate.outputs.version }}-b${NATIVE_BUILD_VERSION}.zip"
          archive="$GITHUB_WORKSPACE/release/native/$archive_name"
          signature="$(node -e 'process.stdout.write(require(process.argv[1]).sparkle.edSignature)' "$receipt")"
          archive_length="$(node -e 'process.stdout.write(String(require(process.argv[1]).sparkle.archiveLength))' "$receipt")"
          mkdir -p "$appcast_directory"
          appcast_arguments=(
            --zip "$archive"
            --version "${{ steps.candidate.outputs.version }}"
            --build "$NATIVE_BUILD_VERSION"
            --ed-signature "$signature"
            --archive-length "$archive_length"
          )
          if gh release view kaisola-updates >/dev/null 2>&1; then
            mkdir -p "$appcast_directory/download"
            if gh release download kaisola-updates \
              --pattern appcast.xml \
              --dir "$appcast_directory/download"; then
              mv "$appcast_directory/download/appcast.xml" "$existing_appcast"
              appcast_arguments+=(--existing "$existing_appcast")
            else
              feed_asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/kaisola-updates" --jq '.assets | length')"
              test "$feed_asset_count" = 0 || {
                echo 'permanent update release has assets but no appcast.xml' >&2
                exit 1
              }
            fi
          fi
          enclosure_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive_name}"
          appcast_arguments+=(--url "$enclosure_url" --output "$generated_appcast")
          node scripts/native-appcast.cjs \
            "${appcast_arguments[@]}"
          test -s "$generated_appcast"
      - name: Publish exact candidate assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/native/release-candidate.json
            release/native/Kaisola-${{ steps.candidate.outputs.version }}-b${{ env.NATIVE_BUILD_VERSION }}.zip
            release/native/Kaisola-${{ steps.candidate.outputs.version }}-b${{ env.NATIVE_BUILD_VERSION }}.zip.sha256
            release/native/Kaisola-${{ steps.candidate.outputs.version }}-b${{ env.NATIVE_BUILD_VERSION }}.dmg
            release/native/Kaisola-${{ steps.candidate.outputs.version }}-b${{ env.NATIVE_BUILD_VERSION }}.dmg.sha256
            release/native/Kaisola.dmg
            release/native/Kaisola.dmg.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Verify remote release asset digests before feed mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="$RUNNER_TEMP/remote-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$remote"
          node - "$GITHUB_WORKSPACE/release/native/release-candidate.json" "$remote" <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const receiptPath = process.argv[2]
          const remotePath = process.argv[3]
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'))
          const remote = JSON.parse(fs.readFileSync(remotePath, 'utf8'))
          const receiptBytes = fs.readFileSync(receiptPath)
          const expected = [...receipt.artifacts, {
            name: path.basename(receiptPath),
            size: receiptBytes.length,
            sha256: crypto.createHash('sha256').update(receiptBytes).digest('hex'),
          }]
          const assets = new Map()
          for (const asset of remote.assets || []) {
            if (assets.has(asset.name)) throw new Error(`duplicate remote asset: ${asset.name}`)
            assets.set(asset.name, asset)
          }
          if (assets.size !== expected.length) throw new Error('remote release has an unexpected asset set')
          for (const item of expected) {
            const asset = assets.get(item.name)
            if (!asset || asset.state !== 'uploaded' || asset.size !== item.size
                || asset.digest !== `sha256:${item.sha256}`) {
              throw new Error(`remote release asset does not match candidate receipt: ${item.name}`)
            }
          }
          console.log(`REMOTE_RELEASE_ASSETS=PASS count=${expected.length}`)
          NODE
      - name: Publish and verify permanent Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          generated_appcast="$RUNNER_TEMP/kaisola-appcast/appcast.xml"
          verified_directory="$RUNNER_TEMP/kaisola-appcast/verified"
          if ! gh release view kaisola-updates >/dev/null 2>&1; then
            gh release create kaisola-updates \
              --target "$GITHUB_SHA" \
              --title 'Kaisola update feed' \
              --notes 'Permanent signed Sparkle update feed. Managed by the release workflow.' \
              --prerelease \
              --latest=false
          fi
          gh release upload kaisola-updates "$generated_appcast" --clobber
          mkdir -p "$verified_directory"
          gh release download kaisola-updates \
            --pattern appcast.xml \
            --dir "$verified_directory"
          cmp "$generated_appcast" "$verified_directory/appcast.xml"
          shasum -a 256 "$generated_appcast" "$verified_directory/appcast.xml"
      - name: Report fast-promotion timing and identity
        run: |
          elapsed="$(( $(date +%s) - PROMOTION_STARTED_AT ))"
          {
            echo '### Native release promotion'
            echo
            echo "- Candidate run: \`${{ steps.candidate.outputs.run-id }}\`"
            echo "- Candidate artifact digest: \`${{ steps.candidate.outputs.artifact-digest }}\`"
            echo "- Version/build: \`${{ steps.candidate.outputs.version }} ($NATIVE_BUILD_VERSION)\`"
            echo "- Promotion duration: \`${elapsed}s\` (candidate build/notarization excluded)"
          } >> "$GITHUB_STEP_SUMMARY"
