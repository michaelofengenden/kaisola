name: swift-contracts

on:
  workflow_call:
    inputs:
      # There is deliberately no input that skips the iPhone lane. Promotion
      # reads the companion contract receipt this job uploads for the exact
      # commit, so any such switch would let a caller promote an unproven
      # Companion by turning the proof off.
      #
      # The release-candidate pipeline builds, preflights, and probes the real
      # Developer ID bytes in its own job, so its call skips this workflow's
      # duplicate macOS release compile. Standalone push/PR runs keep it.
      skip-macos-release-build:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/swift-contracts.yml'
      - 'native/**'
      - 'mobile/KaisolaCompanion/**'
      - 'protocol/broker/**'
      - 'runtime/**'
      - 'tests/**'
      - 'scripts/companion-*.cjs'
      - 'scripts/download-native-node-runtime.cjs'
      - 'scripts/native-*.cjs'
      - 'scripts/release-fast.cjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/swift-contracts.yml'
      - 'native/**'
      - 'mobile/KaisolaCompanion/**'
      - 'protocol/broker/**'
      - 'runtime/**'
      - 'tests/**'
      - 'scripts/companion-*.cjs'
      - 'scripts/download-native-node-runtime.cjs'
      - 'scripts/native-*.cjs'
      - 'scripts/release-fast.cjs'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: >-
    swift-contracts-${{ github.event.pull_request.number || github.ref }}-${{ inputs.skip-macos-release-build }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The iPhone lane. Split from the macOS lane in 2026-08: the two were one
  # serial job — a Companion simulator run followed by the macOS tests, 26
  # minutes end to end — sharing nothing but the checkout. They have no ordering
  # relationship, so side by side costs one extra runner and returns the wall
  # clock of the slower half instead of their sum.
  #
  # Declared before `verify` on purpose. `companionContractReceipt.test.cjs`
  # reads a step by slicing to the next step, so the final step of whichever job
  # sits above `optimized-macos-pdf` runs on into that job's `if:` — and the
  # test asserts this lane is never conditional. Keeping a plain job header
  # underneath is what makes that reading honest.
  #
  # The receipt upload stays here: `release.yml` refuses to promote without the
  # companion contract receipt from this run, and artifacts belong to the run
  # rather than the job, so splitting does not move where promotion looks.
  companion:
    runs-on: macos-15
    timeout-minutes: 45
    env:
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      KAISOLA_COMPANION_XCODE_VERSION: '16.4'
      KAISOLA_COMPANION_XCODE_BUILD: 16F6
      # Xcode 16.4 owns the iOS 18.5 simulator SDK. During the recurring crash,
      # `OS=latest` instead selected the image's Xcode-26-owned iOS 26.2 runtime.
      KAISOLA_COMPANION_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
      KAISOLA_COMPANION_SIMULATOR_OS: '18.5'
      KAISOLA_COMPANION_SIMULATOR_NAME: iPhone 16 Pro
      KAISOLA_COMPANION_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
      KAISOLA_COMPANION_SIMULATOR_ARCH: arm64
      # The test command uses the exact resolved UDID. The promotion receipt
      # records the same pinned name and runtime in its stable public shape.
      COMPANION_TEST_DESTINATION: 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Prepare Companion diagnostics paths
        run: |
          DIAGNOSTICS="$RUNNER_TEMP/kaisola-companion-diagnostics"
          mkdir -p "$DIAGNOSTICS"
          printf 'KAISOLA_COMPANION_DIAGNOSTICS=%s\n' "$DIAGNOSTICS" >> "$GITHUB_ENV"
          printf 'KAISOLA_COMPANION_RESULT_BUNDLE=%s/KaisolaCompanion.xcresult\n' "$DIAGNOSTICS" >> "$GITHUB_ENV"
      - name: Record Apple toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/companion-contract"
          swift --version | tee "$KAISOLA_COMPANION_DIAGNOSTICS/swift-version.txt"
          xcodebuild -version | tee "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-version.txt"
          cat \
            "$KAISOLA_COMPANION_DIAGNOSTICS/swift-version.txt" \
            "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-version.txt" \
            > "$RUNNER_TEMP/companion-contract/apple-toolchain.txt"
          {
            printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'image_os=%s\n' "${ImageOS:-unknown}"
            printf 'image_version=%s\n' "${ImageVersion:-unknown}"
            uname -a
            sw_vers
          } > "$KAISOLA_COMPANION_DIAGNOSTICS/runner-host.txt"
      - name: Install exact Node helper dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          KAISOLA_SKIP_NATIVE_REBUILD: '1'
      - name: Lint security-sensitive workflow checkouts
        run: node --test tests/node/workflowSecurity.test.cjs
      - name: Download checksum-pinned Node runtime
        run: node scripts/download-native-node-runtime.cjs arm64
      - name: Resolve exact Companion simulator
        id: companion-simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json > "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-runtimes.json"
          xcrun simctl list devices available --json > "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-devices.json"
          xcodebuild \
            -project mobile/KaisolaCompanion/KaisolaCompanion.xcodeproj \
            -scheme KaisolaCompanion \
            -showdestinations \
            > "$KAISOLA_COMPANION_DIAGNOSTICS/xcode-destinations.txt"
          node scripts/companion-ci-test-gate.cjs resolve-simulator \
            --devices-json "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-devices.json" \
            --runtimes-json "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-runtimes.json" \
            --xcode-version-file "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-version.txt" \
            --expected-xcode-version "$KAISOLA_COMPANION_XCODE_VERSION" \
            --expected-xcode-build-version "$KAISOLA_COMPANION_XCODE_BUILD" \
            --runtime-identifier "$KAISOLA_COMPANION_SIMULATOR_RUNTIME" \
            --runtime-version "$KAISOLA_COMPANION_SIMULATOR_OS" \
            --device-type-identifier "$KAISOLA_COMPANION_SIMULATOR_DEVICE_TYPE" \
            --device-name "$KAISOLA_COMPANION_SIMULATOR_NAME" \
            --architecture "$KAISOLA_COMPANION_SIMULATOR_ARCH" \
            --output "$KAISOLA_COMPANION_DIAGNOSTICS/destination.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Compile optimized iPhone app against KaisolaCore
        run: >-
          xcodebuild
          -project mobile/KaisolaCompanion/KaisolaCompanion.xcodeproj
          -scheme KaisolaCompanion
          -configuration Release
          -destination "${{ steps.companion-simulator.outputs.destination }}"
          -derivedDataPath "$RUNNER_TEMP/kaisola-ios"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile iPhone test bundle against KaisolaCore
        run: >-
          xcodebuild
          -project mobile/KaisolaCompanion/KaisolaCompanion.xcodeproj
          -scheme KaisolaCompanion
          -configuration Debug
          -destination "${{ steps.companion-simulator.outputs.destination }}"
          -derivedDataPath "$RUNNER_TEMP/kaisola-ios-tests"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Verify Companion test-host architectures
        run: >-
          node scripts/companion-ci-test-gate.cjs verify-architectures
          --architecture "$KAISOLA_COMPANION_SIMULATOR_ARCH"
          --binary "test-host=$RUNNER_TEMP/kaisola-ios-tests/Build/Products/Debug-iphonesimulator/KaisolaCompanion.app/KaisolaCompanion"
          --binary "test-host-debug-dylib=$RUNNER_TEMP/kaisola-ios-tests/Build/Products/Debug-iphonesimulator/KaisolaCompanion.app/KaisolaCompanion.debug.dylib"
          --binary "test-bundle=$RUNNER_TEMP/kaisola-ios-tests/Build/Products/Debug-iphonesimulator/KaisolaCompanion.app/PlugIns/KaisolaCompanionTests.xctest/KaisolaCompanionTests"
          --output "$KAISOLA_COMPANION_DIAGNOSTICS/binary-architectures.json"
      - name: Boot and probe pinned Companion simulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          UDID="${{ steps.companion-simulator.outputs.udid }}"
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tee "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-bootstatus.log"
          PROBE_SOURCE="$KAISOLA_COMPANION_DIAGNOSTICS/simulator-architecture-probe.c"
          PROBE_BINARY="$KAISOLA_COMPANION_DIAGNOSTICS/simulator-architecture-probe"
          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <sys/utsname.h>' \
            'int main(void) {' \
            '  struct utsname value;' \
            '  if (uname(&value) != 0) return 2;' \
            '  return printf("%s\n", value.machine) < 0 ? 3 : 0;' \
            '}' > "$PROBE_SOURCE"
          xcrun --sdk iphonesimulator clang \
            -target "$KAISOLA_COMPANION_SIMULATOR_ARCH-apple-ios$KAISOLA_COMPANION_SIMULATOR_OS-simulator" \
            -Os -Werror \
            -o "$PROBE_BINARY" \
            "$PROBE_SOURCE"
          /usr/bin/codesign --force --sign - "$PROBE_BINARY"
          /usr/bin/lipo -archs "$PROBE_BINARY" \
            | tee "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-probe-binary-architecture.txt"
          xcrun simctl spawn --arch="$KAISOLA_COMPANION_SIMULATOR_ARCH" "$UDID" "$PROBE_BINARY" \
            | tee "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-spawn-architecture.txt"
          node scripts/companion-ci-test-gate.cjs verify-simulator-probe \
            --input "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-spawn-architecture.txt" \
            --architecture "$KAISOLA_COMPANION_SIMULATOR_ARCH" \
            --output "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-probe.json"
      - name: Run iPhone contract and app tests
        id: companion-tests
        timeout-minutes: 12
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project mobile/KaisolaCompanion/KaisolaCompanion.xcodeproj \
            -scheme KaisolaCompanion \
            -configuration Debug \
            -destination "${{ steps.companion-simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/kaisola-ios-tests" \
            -resultBundlePath "$KAISOLA_COMPANION_RESULT_BUNDLE" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            TEST_RUNNER_KAISOLA_COMPANION_TEST_LAUNCH_DIAGNOSTICS=1 \
            test-without-building \
            2>&1 | tee \
              "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-test.log" \
              "$RUNNER_TEMP/companion-contract/companion-tests.log"
          PIPE_STATUSES=("${PIPESTATUS[@]}")
          STATUS="${PIPE_STATUSES[0]}"
          if [[ "$STATUS" -eq 0 && "${PIPE_STATUSES[1]}" -ne 0 ]]; then
            STATUS="${PIPE_STATUSES[1]}"
          fi
          printf '%s\n' "$STATUS" > "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-exit-code.txt"
          exit "$STATUS"
      - name: Extract Companion xcresult and launch diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          LAUNCH_DIAGNOSTICS_RAW="$KAISOLA_COMPANION_DIAGNOSTICS/launch-diagnostics.raw.log"
          LAUNCH_DIAGNOSTICS="$KAISOLA_COMPANION_DIAGNOSTICS/launch-diagnostics.log"
          : > "$LAUNCH_DIAGNOSTICS_RAW"
          : > "$LAUNCH_DIAGNOSTICS"
          if [[ -f "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-test.log" ]]; then
            grep -aEo 'KAISOLA_COMPANION_TEST_LAUNCH phase=[a-z_]+ pid=[0-9]+' \
              "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-test.log" \
              >> "$LAUNCH_DIAGNOSTICS_RAW" || true
          fi
          if [[ -d "$KAISOLA_COMPANION_RESULT_BUNDLE" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$KAISOLA_COMPANION_RESULT_BUNDLE" \
              --compact \
              > "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-summary.json.tmp" \
              2> "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-summary.stderr"
            if [[ "$?" -eq 0 ]]; then
              mv "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-summary.json.tmp" \
                "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-summary.json"
            fi
            mkdir -p "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics"
            xcrun xcresulttool export diagnostics \
              --path "$KAISOLA_COMPANION_RESULT_BUNDLE" \
              --output-path "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics" \
              > "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics.stdout" \
              2> "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics.stderr"
            if [[ "$?" -eq 0 ]]; then
              printf 'complete\n' > "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics.complete"
            fi
          fi
          if [[ -d "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics" ]]; then
            while IFS= read -r -d '' DIAGNOSTIC_LOG; do
              grep -aEo 'KAISOLA_COMPANION_TEST_LAUNCH phase=[a-z_]+ pid=[0-9]+' \
                "$DIAGNOSTIC_LOG" >> "$LAUNCH_DIAGNOSTICS_RAW" || true
            done < <(find "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics" \
              -type f \( -name '*.log' -o -name '*.txt' \) -print0)
          fi
          awk '!seen[$0]++' "$LAUNCH_DIAGNOSTICS_RAW" > "$LAUNCH_DIAGNOSTICS"
          exit 0
      - name: Gate Companion test bootstrap and count
        if: ${{ always() }}
        run: >-
          node scripts/companion-ci-test-gate.cjs classify-test
          --log "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-test.log"
          --launch-diagnostics "$KAISOLA_COMPANION_DIAGNOSTICS/launch-diagnostics.log"
          --exit-code-file "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-exit-code.txt"
          --result-bundle "$KAISOLA_COMPANION_RESULT_BUNDLE"
          --xcresult-diagnostics "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics"
          --xcresult-diagnostics-success "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics.complete"
          --destination-receipt "$KAISOLA_COMPANION_DIAGNOSTICS/destination.json"
          --architecture-receipt "$KAISOLA_COMPANION_DIAGNOSTICS/binary-architectures.json"
          --simulator-probe-receipt "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-probe.json"
          --xcresult-summary "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-summary.json"
          --simulator-log "$KAISOLA_COMPANION_DIAGNOSTICS/simulator.log.json"
          --simulator-diagnose "$KAISOLA_COMPANION_DIAGNOSTICS/simctl-diagnose"
          --simulator-diagnose-success "$KAISOLA_COMPANION_DIAGNOSTICS/simctl-diagnose.complete"
          --crash-reports "$KAISOLA_COMPANION_DIAGNOSTICS/crash-reports"
          --output "$KAISOLA_COMPANION_DIAGNOSTICS/preliminary-classification.json"
      - name: Collect failed Companion simulator and crash evidence
        if: ${{ failure() }}
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          UDID="${{ steps.companion-simulator.outputs.udid }}"
          mkdir -p "$KAISOLA_COMPANION_DIAGNOSTICS/crash-reports"
          if [[ -n "$UDID" ]]; then
            xcrun simctl spawn "$UDID" log show --style json --last 30m --info --debug --predicate 'process == "KaisolaCompanion" OR process == "KaisolaCompanionTests-Runner" OR process == "testmanagerd" OR subsystem == "com.apple.CoreSimulator"' > "$KAISOLA_COMPANION_DIAGNOSTICS/simulator.log.json.tmp" 2> "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-log.stderr"
            if [[ "$?" -eq 0 ]]; then
              mv "$KAISOLA_COMPANION_DIAGNOSTICS/simulator.log.json.tmp" \
                "$KAISOLA_COMPANION_DIAGNOSTICS/simulator.log.json"
            fi
            xcrun simctl diagnose -b --timeout=60 --output="$KAISOLA_COMPANION_DIAGNOSTICS/simctl-diagnose" --udid="$UDID" 2> "$KAISOLA_COMPANION_DIAGNOSTICS/simctl-diagnose.stderr"
            if [[ "$?" -eq 0 ]]; then
              printf 'complete\n' > "$KAISOLA_COMPANION_DIAGNOSTICS/simctl-diagnose.complete"
            fi
            CRASH_ROOTS=(
              "$HOME/Library/Logs/DiagnosticReports"
              "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/CrashReporter"
            )
            for CRASH_ROOT in "${CRASH_ROOTS[@]}"; do
              if [[ -d "$CRASH_ROOT" ]]; then
                while IFS= read -r -d '' CRASH_REPORT; do
                  cp -p "$CRASH_REPORT" "$KAISOLA_COMPANION_DIAGNOSTICS/crash-reports/"
                done < <(find "$CRASH_ROOT" -type f -mmin -30 \( -iname '*KaisolaCompanion*.crash' -o -iname '*KaisolaCompanion*.ips' \) -print0)
              fi
            done
            if [[ -d "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics" ]]; then
              while IFS= read -r -d '' CRASH_REPORT; do
                cp -p "$CRASH_REPORT" "$KAISOLA_COMPANION_DIAGNOSTICS/crash-reports/"
              done < <(find "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics" \
                -type f \( -iname '*.crash' -o -iname '*.ips' \) -print0)
            fi
          else
            printf 'exact simulator resolution did not complete\n' \
              > "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-collection-unavailable.txt"
          fi
          exit 0
      - name: Seal Companion diagnostic classification
        if: ${{ always() }}
        run: >-
          node scripts/companion-ci-test-gate.cjs classify-test
          --log "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-test.log"
          --launch-diagnostics "$KAISOLA_COMPANION_DIAGNOSTICS/launch-diagnostics.log"
          --exit-code-file "$KAISOLA_COMPANION_DIAGNOSTICS/xcodebuild-exit-code.txt"
          --result-bundle "$KAISOLA_COMPANION_RESULT_BUNDLE"
          --xcresult-diagnostics "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics"
          --xcresult-diagnostics-success "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-diagnostics.complete"
          --destination-receipt "$KAISOLA_COMPANION_DIAGNOSTICS/destination.json"
          --architecture-receipt "$KAISOLA_COMPANION_DIAGNOSTICS/binary-architectures.json"
          --simulator-probe-receipt "$KAISOLA_COMPANION_DIAGNOSTICS/simulator-probe.json"
          --xcresult-summary "$KAISOLA_COMPANION_DIAGNOSTICS/xcresult-summary.json"
          --simulator-log "$KAISOLA_COMPANION_DIAGNOSTICS/simulator.log.json"
          --simulator-diagnose "$KAISOLA_COMPANION_DIAGNOSTICS/simctl-diagnose"
          --simulator-diagnose-success "$KAISOLA_COMPANION_DIAGNOSTICS/simctl-diagnose.complete"
          --crash-reports "$KAISOLA_COMPANION_DIAGNOSTICS/crash-reports"
          --output "$KAISOLA_COMPANION_DIAGNOSTICS/classification.json"
      - name: Upload failed Companion test evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kaisola-companion-diagnostics
          if-no-files-found: error
          retention-days: 14
      # A green job conclusion is not evidence: only a successfully classified,
      # nonzero test run may produce the receipt consumed by promotion.
      - name: Receipt the executed iPhone contract run
        run: |
          set -euo pipefail
          node scripts/companion-contract-receipt.cjs create \
            --test-log "$RUNNER_TEMP/companion-contract/companion-tests.log" \
            --toolchain-log "$RUNNER_TEMP/companion-contract/apple-toolchain.txt" \
            --destination "$COMPANION_TEST_DESTINATION" \
            --runner-image "$ImageOS" \
            --runner-image-version "$ImageVersion" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/companion-contract/companion-contract.json"
      - name: Upload the executed iPhone contract receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaisola-companion-contract
          path: ${{ runner.temp }}/companion-contract/companion-contract.json
          if-no-files-found: error
          retention-days: 90

  # The macOS and shared-contract lane, in parallel with `companion`.
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install exact Node helper dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          KAISOLA_SKIP_NATIVE_REBUILD: '1'
      - name: Lint security-sensitive workflow checkouts
        run: node --test tests/node/workflowSecurity.test.cjs
      - name: Download checksum-pinned Node runtime
        run: node scripts/download-native-node-runtime.cjs arm64
      - name: Test broker runtime durability manifest
        run: node tests/node/brokerRuntimeManifest.cjs
      - name: Test native packaging, compatibility, and resource policies
        run: >-
          node --test
          tests/node/swiftContractsPaths.test.cjs
          tests/node/brokerCompatibility.test.cjs
          tests/node/companionContractReceipt.test.cjs
          tests/node/companionCITestGate.test.cjs
          tests/node/companionProtocolTables.test.cjs
          tests/node/nativeAppcast.test.cjs
          tests/node/nativeBrokerPackage.test.cjs
          tests/node/nativeReleaseCandidate.test.cjs
          tests/node/nativeReleasePreflight.test.cjs
          tests/node/nativeResourceGate.test.cjs
          tests/node/nativeResourceFixtureGate.test.cjs
          tests/node/nativePdfPreviewBudget.test.cjs
      - name: Test shared Swift contracts
        run: swift test --package-path native/KaisolaCore
      - name: Compile Kaisola macOS test bundle
        run: >-
          xcodebuild
          -project native/KaisolaMac/KaisolaMac.xcodeproj
          -scheme Kaisola
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/kaisola-mac-tests"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Run Kaisola macOS tests
        run: >-
          xcodebuild
          -project native/KaisolaMac/KaisolaMac.xcodeproj
          -scheme Kaisola
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/kaisola-mac-tests"
          CODE_SIGNING_ALLOWED=NO
          test-without-building


  # The installed optimized-PDF receipt is a performance contract. Give it a
  # fresh runner with no booted simulator, CoreSimulator services, or iPhone
  # build/test residue so PDFKit cadence and process footprint measure only the
  # packaged macOS app. Release-candidate callers already prove their signed
  # candidate bytes and retain the existing skip behavior here.
  optimized-macos-pdf:
    if: ${{ !inputs.skip-macos-release-build }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install exact Node helper dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          KAISOLA_SKIP_NATIVE_REBUILD: '1'
      - name: Download checksum-pinned Node runtime
        run: node scripts/download-native-node-runtime.cjs arm64
      - name: Compile optimized Kaisola macOS app
        if: ${{ !inputs.skip-macos-release-build }}
        run: >-
          xcodebuild
          -project native/KaisolaMac/KaisolaMac.xcodeproj
          -scheme Kaisola
          -configuration LocalRelease
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/kaisola-mac"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-
          build
      - name: Verify sealed Kaisola package
        if: ${{ !inputs.skip-macos-release-build }}
        run: >-
          npm run native:preflight --
          --app "$RUNNER_TEMP/kaisola-mac/Build/Products/LocalRelease/Kaisola.app"
      - name: Prove packaged broker and PTY continuity
        if: ${{ !inputs.skip-macos-release-build }}
        run: >-
          npm run native:helper:probe --
          "$RUNNER_TEMP/kaisola-mac/Build/Products/LocalRelease/Kaisola.app/Contents/Resources/BrokerHelper"
          --require-signed-host
      - name: Gate installed optimized PDF previews
        if: ${{ !inputs.skip-macos-release-build }}
        run: |
          set -euo pipefail
          installed_root="$RUNNER_TEMP/Applications"
          installed_app="$installed_root/Kaisola PDF Budget QA.app"
          mkdir -p "$installed_root"
          ditto "$RUNNER_TEMP/kaisola-mac/Build/Products/LocalRelease/Kaisola.app" "$installed_app"
          npm run native:pdf-preview-budget -- \
            --app "$installed_app" \
            --output "$RUNNER_TEMP/native-pdf-preview-budget.json"
